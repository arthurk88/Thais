
name: Laravel CI & Deploy

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist

  deploy:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      # 1. Atualiza o código no servidor.
      - name: Preparar servidor
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -Ee

            APP="/home/auroracloud.com.br/erp.auroracloud.com.br"
            cd "$APP"

            git config --global --add safe.directory "$APP"

            echo "🔒 Colocando aplicação em manutenção"
            php artisan down --retry=60 || {
              echo "❌ Não foi possível colocar a aplicação em manutenção."
              exit 1
            }

            echo "🔑 Encerrando sessões"
            php artisan tinker --execute="DB::table('sessions')->delete();"

            echo "📦 Atualizando código"
            git fetch origin main
            git reset --hard origin/main

            echo "✔ Código atualizado"

      # 2. Compila os assets e finaliza a atualização do Laravel.
      - name: Finalizar deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -Ee

            APP="/home/auroracloud.com.br/erp.auroracloud.com.br"
            cd "$APP"

            echo "🔁 Verificando link do storage"
            php artisan storage:link || true

            echo "📦 Instalando dependências NPM"
            npm ci --silent --no-progress

            echo "🧱 Compilando assets"
            npm run build

            echo "🧹 Limpando caches"
            php artisan optimize:clear

            echo "🚚 Executando migrações"
            php artisan migrate --force

            echo "⚙ Reconstruindo caches"
            php artisan optimize

            echo "🔎 Validando manifest do Vite"
            test -s public/build/manifest.json

            echo "🚀 Retirando aplicação da manutenção"
            php artisan up

            echo "✔ Deploy completo"


